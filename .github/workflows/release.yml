name: Manual Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git pull origin main --rebase 

      - name: Extract Version from pom.xml securely
        run: |
          # 100% reliable XML parsing. It explicitly targets the root project version.
          RAW_VERSION=$(xmllint --xpath "/*[local-name()='project']/*[local-name()='version']/text()" pom.xml)
          
          # Strips the -SNAPSHOT so it correctly matches the tag Maven is about to create
          CLEAN_VERSION=$(echo "$RAW_VERSION" | sed 's/-SNAPSHOT//')
          
          echo "Extracted Raw Version: $RAW_VERSION"
          echo "Cleaned Version for Tag: $CLEAN_VERSION"
          
          # Passes the exact version string to the environment variables
          echo "CLEAN_VERSION=$CLEAN_VERSION" >> $GITHUB_ENV

      - name: Maven Release Prepare & Perform
        run: |
          mvn --batch-mode release:prepare release:perform \
            -Darguments="-DskipTests" \
            -Dusername=${{ github.actor }} \
            -Dpassword=${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          # This will dynamically output "v1.0.1" and "Release v1.0.1"
          tag_name: v${{ env.CLEAN_VERSION }}
          name: Release v${{ env.CLEAN_VERSION }}
          files: target/*.jar
          generate_release_notes: true
